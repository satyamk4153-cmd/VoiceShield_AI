version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinelvoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelvoice
      POSTGRES_USER: sentineluser
      POSTGRES_PASSWORD: sentinelpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentineluser -d sentinelvoice"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelvoice-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelvoice-backend
    restart: unless-stopped
    environment:
      - APP_MODE=${APP_MODE:-development}
      - AI_PROVIDER=${AI_PROVIDER:-demo}
      - DATABASE_URL=postgresql://sentineluser:sentinelpassword@postgres:5432/sentinelvoice
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-sentinelvoice_secure_dev_signing_key_32bytes}
      - MAX_AUDIO_SIZE_MB=25
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelvoice-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
