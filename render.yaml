version: "1"

services:
  # -------------------------------------------------------------
  # VoiceShield AI - Backend API Web Service (FastAPI / Python)
  # -------------------------------------------------------------
  - type: web
    name: voiceshield-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: APP_MODE
        value: demo
      - key: AI_PROVIDER
        value: local
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./sentinelvoice.db

  # -------------------------------------------------------------
  # VoiceShield AI - Frontend SOC Dashboard (Next.js / Node)
  # -------------------------------------------------------------
  - type: web
    name: voiceshield-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: voiceshield-backend
          property: host
